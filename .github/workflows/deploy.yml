name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app
        run: if [ -f app-bundle.zip ]; then unzip -o -q app-bundle.zip; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up database and settings
        run: node scripts/setup.mjs
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy server functions
        run: |
          for fn in push child; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api || supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: pages
        uses: actions/deploy-pages@v4
